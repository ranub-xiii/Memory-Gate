[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-gate"
version = "0.1.0"
description = "Evidence-bound memory admission and controlled model invocation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "flake8>=7,<8"]

[tool.setuptools]
packages = ["authoritylab"]
